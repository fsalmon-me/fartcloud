name: Build and Deploy FartCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Build WASM (release)
        run: cargo build --release --target wasm32-unknown-unknown
      
      - name: Prepare dist folder
        run: |
          mkdir -p dist
          cp target/wasm32-unknown-unknown/release/fartcloud.wasm dist/
          cp -r assets dist/ 2>/dev/null || true
          cp web/index.html dist/
      
      - name: Optimize WASM with wasm-opt (optional)
        run: |
          if command -v wasm-opt &> /dev/null; then
            wasm-opt -Oz dist/fartcloud.wasm -o dist/fartcloud.wasm
          else
            echo "wasm-opt not found, skipping optimization"
          fi
        continue-on-error: true
      
      - name: Deploy to Hetzner via rsync
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: /var/www/fartcloud/
          remote_host: ${{ secrets.HETZNER_SSH_HOST }}
          remote_user: ${{ secrets.HETZNER_SSH_USER }}
          remote_key: ${{ secrets.HETZNER_SSH_KEY }}
