<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FartCloud 💨 - Pète pour voler!</title>
    <!-- Inline favicon to prevent 404 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💨</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }
        
        body {
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #glcanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            outline: none;
            touch-action: none;
        }
        
        .footer {
            position: fixed;
            bottom: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            pointer-events: none;
            z-index: 5;
        }
        
        /* Mobile keyboard input overlay */
        #mobileInputOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        #mobileInputOverlay.active {
            display: flex;
        }
        
        #mobileInputOverlay h2 {
            color: white;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        #mobileNameInput {
            font-size: 28px;
            padding: 15px 25px;
            border: 3px solid #4CAF50;
            border-radius: 10px;
            text-align: center;
            width: 280px;
            max-width: 80%;
            background: white;
            color: black;
            outline: none;
        }
        
        #mobileInputOverlay .buttons {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        
        #mobileInputOverlay button {
            font-size: 20px;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }
        
        #mobileInputOk {
            background: #4CAF50;
            color: white;
        }
        
        #mobileInputSkip {
            background: #666;
            color: white;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    
    <!-- Mobile keyboard input overlay -->
    <div id="mobileInputOverlay">
        <h2>Entre ton pseudo:</h2>
        <input type="text" id="mobileNameInput" maxlength="12" placeholder="FartKing42" 
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="buttons">
            <button id="mobileInputOk">OK ✓</button>
            <button id="mobileInputSkip">Anonyme</button>
        </div>
    </div>
    
    <div class="footer">FartCloud v0.1.0 - Made with 🦀 Rust + Macroquad</div>

    <!-- Macroquad JS Bundle (local copy to avoid COEP issues) -->
    <script src="./mq_js_bundle.js"></script>
    
    <script>
        // Mobile keyboard input system for WASM games
        var mobileInputCallback = null;
        var mobileInputResult = null;
        var inputConfirmed = false;
        
        const overlay = document.getElementById('mobileInputOverlay');
        const input = document.getElementById('mobileNameInput');
        const okBtn = document.getElementById('mobileInputOk');
        const skipBtn = document.getElementById('mobileInputSkip');
        
        function confirmInput(value) {
            mobileInputResult = value || '';
            inputConfirmed = true;
            overlay.classList.remove('active');
            input.blur();
            document.getElementById('glcanvas').focus();
        }
        
        okBtn.addEventListener('click', function(e) {
            e.preventDefault();
            confirmInput(input.value);
        });
        
        okBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            confirmInput(input.value);
        });
        
        skipBtn.addEventListener('click', function(e) {
            e.preventDefault();
            confirmInput('Anonymous');
        });
        
        skipBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            confirmInput('Anonymous');
        });
        
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmInput(input.value);
            }
        });
        
        // Register as miniquad plugin
        miniquad_add_plugin({
            register_plugin: function(importObject) {
                // Show mobile keyboard overlay
                importObject.env.js_show_mobile_keyboard = function() {
                    mobileInputResult = null;
                    inputConfirmed = false;
                    input.value = '';
                    overlay.classList.add('active');
                    // Small delay to ensure overlay is visible before focus
                    setTimeout(function() {
                        input.focus();
                        input.click();
                    }, 100);
                };
                
                // Hide mobile keyboard overlay
                importObject.env.js_hide_mobile_keyboard = function() {
                    overlay.classList.remove('active');
                    input.blur();
                    document.getElementById('glcanvas').focus();
                };
                
                // Check if input was confirmed (OK or Skip pressed)
                importObject.env.js_is_input_confirmed = function() {
                    return inputConfirmed ? 1 : 0;
                };
                
                // Get the input result length
                importObject.env.js_get_input_length = function() {
                    return mobileInputResult ? mobileInputResult.length : 0;
                };
                
                // Copy input result to WASM memory
                importObject.env.js_get_input_value = function(ptr, max_len) {
                    if (!mobileInputResult) return 0;
                    const encoder = new TextEncoder();
                    const bytes = encoder.encode(mobileInputResult);
                    const len = Math.min(bytes.length, max_len);
                    const memory = new Uint8Array(wasm_memory.buffer);
                    for (let i = 0; i < len; i++) {
                        memory[ptr + i] = bytes[i];
                    }
                    return len;
                };
                
                // Reset input state for next use
                importObject.env.js_reset_input = function() {
                    mobileInputResult = null;
                    inputConfirmed = false;
                };
            },
            name: "mobile_keyboard",
            version: 1
        });
        
        // ====================================================================
        // FIREBASE FIRESTORE LEADERBOARD SYSTEM
        // ====================================================================
        
        const FIREBASE_PROJECT = 'myitproject-site';
        const FIRESTORE_BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;
        
        // Leaderboard state
        var leaderboardData = null;
        var leaderboardReady = false;
        var leaderboardFetching = false;
        
        // Local storage for high score
        const HIGH_SCORE_KEY = 'fartcloud_high_score';
        
        // Submit a score to Firestore
        async function submitScoreToFirestore(name, score) {
            try {
                const response = await fetch(`${FIRESTORE_BASE}/scores`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fields: {
                            name: { stringValue: name },
                            score: { integerValue: score.toString() },
                            timestamp: { timestampValue: new Date().toISOString() }
                        }
                    })
                });
                if (!response.ok) {
                    console.error('[Firestore] Submit failed:', response.status);
                }
            } catch (e) {
                console.error('[Firestore] Submit error:', e);
            }
        }
        
        // Fetch top 10 scores from Firestore
        async function fetchLeaderboardFromFirestore() {
            leaderboardFetching = true;
            leaderboardReady = false;
            
            try {
                // Firestore REST API query for top 10 by score descending
                const response = await fetch(`${FIRESTORE_BASE}:runQuery`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        structuredQuery: {
                            from: [{ collectionId: 'scores' }],
                            orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }],
                            limit: 100
                        }
                    })
                });
                
                if (!response.ok) {
                    console.error('[Firestore] Fetch failed:', response.status);
                    leaderboardData = [];
                } else {
                    const data = await response.json();
                    leaderboardData = [];
                    
                    // Parse Firestore response
                    for (const item of data) {
                        if (item.document && item.document.fields) {
                            const fields = item.document.fields;
                            leaderboardData.push({
                                name: fields.name?.stringValue || 'Unknown',
                                score: parseInt(fields.score?.integerValue || '0', 10)
                            });
                        }
                    }
                }
            } catch (e) {
                console.error('[Firestore] Fetch error:', e);
                leaderboardData = [];
            }
            
            leaderboardFetching = false;
            leaderboardReady = true;
        }
        
        // Register Firestore plugin
        miniquad_add_plugin({
            register_plugin: function(importObject) {
                // Submit score to Firestore
                importObject.env.js_submit_score = function(name_ptr, name_len, score) {
                    const memory = new Uint8Array(wasm_memory.buffer);
                    const nameBytes = memory.slice(name_ptr, name_ptr + name_len);
                    const name = new TextDecoder().decode(nameBytes);
                    submitScoreToFirestore(name, score);
                };
                
                // Start fetching leaderboard
                importObject.env.js_fetch_leaderboard = function() {
                    if (!leaderboardFetching) {
                        fetchLeaderboardFromFirestore();
                    }
                };
                
                // Check if leaderboard data is ready
                importObject.env.js_is_leaderboard_ready = function() {
                    return leaderboardReady ? 1 : 0;
                };
                
                // Get leaderboard entry count
                importObject.env.js_get_leaderboard_count = function() {
                    return leaderboardData ? leaderboardData.length : 0;
                };
                
                // Get leaderboard entry (name)
                importObject.env.js_get_leaderboard_name = function(index, ptr, max_len) {
                    if (!leaderboardData || index >= leaderboardData.length) return 0;
                    const name = leaderboardData[index].name;
                    const encoder = new TextEncoder();
                    const bytes = encoder.encode(name);
                    const len = Math.min(bytes.length, max_len);
                    const memory = new Uint8Array(wasm_memory.buffer);
                    for (let i = 0; i < len; i++) {
                        memory[ptr + i] = bytes[i];
                    }
                    return len;
                };
                
                // Get leaderboard entry (score)
                importObject.env.js_get_leaderboard_score = function(index) {
                    if (!leaderboardData || index >= leaderboardData.length) return 0;
                    return leaderboardData[index].score;
                };
                
                // Reset leaderboard ready state (for re-fetching)
                importObject.env.js_reset_leaderboard = function() {
                    leaderboardReady = false;
                };
                
                // Save high score to localStorage
                importObject.env.js_save_high_score = function(score) {
                    try {
                        localStorage.setItem(HIGH_SCORE_KEY, score.toString());
                    } catch (e) {
                        console.warn('[LocalStorage] Save failed:', e);
                    }
                };
                
                // Get high score from localStorage
                importObject.env.js_get_high_score = function() {
                    try {
                        const stored = localStorage.getItem(HIGH_SCORE_KEY);
                        return stored ? parseInt(stored, 10) : 0;
                    } catch (e) {
                        console.warn('[LocalStorage] Get failed:', e);
                        return 0;
                    }
                };
            },
            name: "firestore_leaderboard",
            version: 1
        });
        
        // Load the WASM file
        load("./fartcloud.wasm");
    </script>
</body>
</html>
