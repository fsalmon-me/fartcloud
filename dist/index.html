<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FartCloud 💨 - Pète pour voler!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #glcanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            outline: none;
        }
        
        .footer {
            position: fixed;
            bottom: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div class="footer">FartCloud v0.1.0 - Made with 🦀 Rust + Macroquad</div>

    <!-- Macroquad JS Bundle (local copy to avoid COEP issues) -->
    <script src="./mq_js_bundle.js"></script>
    
    <script>
        // Load the WASM file
        load("./fartcloud.wasm");
    </script>
</body>
</html>
